[book]
title = "hcpctl: CLI for HCP Terraform, Terraform Cloud & TFE"
description = "hcpctl is an open-source, kubectl-style CLI for HCP Terraform (Terraform Cloud, TFC) and Terraform Enterprise (TFE). List workspaces, runs, projects, teams and state from the terminal."
authors = ["pkodzis"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
git-repository-url = "https://github.com/pkodzis/hcpctl"
edit-url-template = "https://github.com/pkodzis/hcpctl/edit/main/docs/src/{path}"
site-url = "https://hcpctl.com/"
additional-css = []
additional-js = []
copy-fonts = true
theme = "theme"
